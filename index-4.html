<!DOCTYPE html>
<html lang="uk">
<head>

<title>GUN RUN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root {
  /* Макет: логічна сцена висотою 720 одиниць, масштабована під екран. Меню тримаються кутів, боєць стоїть у центрі, кнопка «Грати» займає правий нижній кут. */
  --ink: #160c2c;
  --plum: #2b1a5c;
  --violet: #5b3fb5;
  --sun: #ffc531;
  --mint: #2fe08f;
  --flare: #ff4867;
  --sky: #38b6ff;
  --font-display: "Unbounded", "Rubik", "Segoe UI", Roboto, system-ui, sans-serif;
  --font-body: "Rubik", "Segoe UI", Roboto, system-ui, -apple-system, sans-serif;
  --sl: 0px; --sr: 0px; --st: 0px; --sb: 0px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--ink); color: #fff; }
body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; font-family: var(--font-body); }
#stage { position: fixed; left: 0; top: 0; overflow: hidden; transform-origin: 0 0; background: var(--ink); }
#cv { position: absolute; left: 0; top: 0; display: block; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; margin: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
img { -webkit-user-drag: none; user-select: none; }
.ico { display: block; width: 100%; height: 100%; overflow: visible; }
.screen { position: absolute; inset: 0; display: none; }
.screen.on { display: block; animation: scrIn .22s ease; }
@keyframes scrIn { from { opacity: 0; transform: scale(1.02); } to { opacity: 1; transform: none; } }

/* ---- обведений текст ---- */
.o2 { text-shadow: -2px -2px 0 var(--ink), 0 -2px 0 var(--ink), 2px -2px 0 var(--ink), 2px 0 0 var(--ink), 2px 2px 0 var(--ink), 0 2px 0 var(--ink), -2px 2px 0 var(--ink), -2px 0 0 var(--ink), 0 4px 0 var(--ink); }
.o3 { text-shadow: -3px -3px 0 var(--ink), 0 -3px 0 var(--ink), 3px -3px 0 var(--ink), 3px 0 0 var(--ink), 3px 3px 0 var(--ink), 0 3px 0 var(--ink), -3px 3px 0 var(--ink), -3px 0 0 var(--ink), -2px -3px 0 var(--ink), 2px -3px 0 var(--ink), -2px 3px 0 var(--ink), 2px 3px 0 var(--ink), 0 6px 0 var(--ink); }
.fit { display: block; white-space: nowrap; min-width: 0; max-width: 100%; }
.fitb { overflow: hidden; }

/* ---- кнопки ---- */
.btn {
  --c1: #ffe46b; --c2: #ffad14; --edge: #d27400; --tc: #fff;
  position: relative; isolation: isolate; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-width: 0; height: 60px; padding: 0 20px 4px; border: 3px solid var(--ink); border-radius: 16px;
  background: linear-gradient(180deg, var(--c1), var(--c2));
  box-shadow: inset 0 -6px 0 var(--edge), inset 0 3px 0 rgba(255, 255, 255, 0.55), 0 5px 0 var(--ink);
  color: var(--tc); font: 900 24px/1.05 var(--font-body); letter-spacing: 0.01em; text-transform: uppercase;
  transition: transform 0.07s ease, box-shadow 0.07s ease, filter 0.15s; touch-action: none; outline: none;
}
.btn::before { content: ""; position: absolute; left: 5px; right: 5px; top: 4px; height: 40%; border-radius: 11px 11px 50% 50% / 11px 11px 14px 14px; background: linear-gradient(rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0.05)); z-index: -1; pointer-events: none; }
.btn.is-down { transform: translateY(4px); box-shadow: inset 0 -3px 0 var(--edge), inset 0 3px 0 rgba(255, 255, 255, 0.4), 0 1px 0 var(--ink); }
.btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
.btn[disabled] { filter: grayscale(0.85) brightness(0.78); cursor: default; }
.btn > .lbl { min-width: 0; flex: 0 1 auto; padding-bottom: 1px; }
.btn > .ico.bi { width: 30px; height: 30px; flex: 0 0 auto; filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.35)); }
.btn.yellow { --c1: #ffe46b; --c2: #ffad14; --edge: #d27400; }
.btn.green { --c1: #86ffbf; --c2: #17c46f; --edge: #0b8648; }
.btn.blue { --c1: #86d6ff; --c2: #2b8cf0; --edge: #1655b0; }
.btn.red { --c1: #ff95a5; --c2: #ef3150; --edge: #a3142e; }
.btn.purple { --c1: #dca6ff; --c2: #8d3cf0; --edge: #5a1fae; }
.btn.dark { --c1: #614db8; --c2: #3b2a86; --edge: #271a5f; }
.btn.white { --c1: #ffffff; --c2: #dde5f5; --edge: #a4b0cc; --tc: var(--ink); }
.btn.white .lbl { text-shadow: none; }
.btn.sq { width: 64px; padding: 0 0 4px; }
.btn.sq > .ico { width: 62%; height: 62%; }
.btn.sm { height: 46px; padding: 0 14px 3px; font-size: 19px; border-radius: 13px; box-shadow: inset 0 -5px 0 var(--edge), inset 0 2px 0 rgba(255, 255, 255, 0.5), 0 4px 0 var(--ink); }
.btn.sm.is-down { transform: translateY(3px); box-shadow: inset 0 -2px 0 var(--edge), 0 1px 0 var(--ink); }
.btn.sm > .ico.bi { width: 24px; height: 24px; }
.btn.wide { width: 100%; }
.badge { position: absolute; top: -12px; right: -12px; z-index: 4; min-width: 32px; height: 32px; padding: 0 7px 1px; border-radius: 16px; background: linear-gradient(#ff7d92, #e5264a); border: 3px solid var(--ink); font: 900 17px/26px var(--font-body); text-align: center; color: #fff; box-shadow: 0 3px 0 var(--ink); animation: bob 1.6s ease-in-out infinite; }
.badge.dot { min-width: 22px; width: 22px; height: 22px; padding: 0; top: -8px; right: -8px; }
.ribbon { position: absolute; z-index: 4; padding: 4px 10px 5px; border-radius: 9px; border: 3px solid var(--ink); background: linear-gradient(#ff7d92, #e5264a); font: 900 15px/1 var(--font-body); transform: rotate(-6deg); box-shadow: 0 3px 0 var(--ink); white-space: nowrap; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

.panel { border: 3px solid var(--ink); border-radius: 18px; background: linear-gradient(#4a35a0, #31206f); box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.12), 0 5px 0 var(--ink); }
.pill { position: relative; display: flex; align-items: center; height: 46px; width: 138px; padding: 0 14px 0 44px; border-radius: 23px; background: rgba(18, 9, 40, 0.82); border: 3px solid var(--ink); box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.12); }
.pill .pi { position: absolute; left: -10px; top: 50%; transform: translateY(-50%); width: 50px; height: 50px; filter: drop-shadow(0 3px 0 rgba(0, 0, 0, 0.4)); }
.pill .pv { font: 900 23px/1 var(--font-body); flex: 1 1 auto; text-align: right; }
.pill .pplus { position: absolute; right: -9px; top: 50%; transform: translateY(-50%); width: 28px; height: 28px; border-radius: 9px; background: linear-gradient(#86ffbf, #17c46f); border: 3px solid var(--ink); font: 900 20px/20px var(--font-body); text-align: center; color: #fff; text-shadow: 0 2px 0 var(--ink); }
.pill.gems { padding-right: 26px; cursor: pointer; }
.chip .ico { width: 22px; height: 22px; flex: 0 0 auto; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px 1px; border-radius: 15px; border: 3px solid var(--ink); font: 800 16px/1 var(--font-body); white-space: nowrap; }
.bar { position: relative; height: 14px; border-radius: 7px; background: rgba(10, 4, 24, 0.7); border: 2px solid var(--ink); overflow: hidden; }
.bar > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: linear-gradient(#ffe46b, #ffad14); }
.bar > span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 900 13px/1 var(--font-body); }

/* ---- завантаження ---- */
#s-load { background: transparent; }
.logo { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%) rotate(-4deg); text-align: center; }
.logo-word { position: relative; display: inline-block; font: 900 128px/0.9 var(--font-display); letter-spacing: 0.02em; background: linear-gradient(#fffbd0 10%, #ffd23f 45%, #ff8a1a 80%); -webkit-background-clip: text; background-clip: text; color: transparent; padding: 0 10px; }
.logo-word::before { content: attr(data-t); position: absolute; inset: 0; padding: 0 10px; z-index: -1; color: var(--ink); -webkit-text-stroke: 18px var(--ink); text-shadow: 0 12px 0 var(--ink), 0 16px 26px rgba(0, 0, 0, 0.5); }
.logo-bolt { position: absolute; left: 50%; top: 50%; width: 220px; height: 220px; transform: translate(-50%, -54%) rotate(14deg); z-index: -2; opacity: 0.95; }
.logo-rib { position: relative; display: inline-block; margin-top: 4px; padding: 6px 36px 10px; font: 900 34px/1 var(--font-display); letter-spacing: 0.3em; background: linear-gradient(#5ad7ff, #2a7ee0); border: 4px solid var(--ink); border-radius: 12px; box-shadow: 0 6px 0 var(--ink); transform: rotate(2deg); }
.load-foot { position: absolute; left: 50%; bottom: calc(var(--sb) + 40px); width: 560px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 12px; }
.load-pct { font: 900 52px/1 var(--font-body); }
.load-bar { width: 100%; height: 30px; border-radius: 15px; border: 4px solid var(--ink); background: #3a1240; overflow: hidden; box-shadow: 0 5px 0 var(--ink); }
.load-bar i { display: block; height: 100%; width: 0; background: linear-gradient(#ffc06b, #ff7a1a); border-radius: 0 10px 10px 0; transition: width 0.15s; }
.load-tip { width: 100%; text-align: center; font: 600 18px/1.3 var(--font-body); color: #ffe9d6; min-height: 24px; }
.load-tap { font: 900 30px/1 var(--font-body); color: #fff; animation: pulse 1.1s ease-in-out infinite; }
.load-hello { position: absolute; left: 50%; top: calc(var(--st) + 22px); transform: translateX(-50%); display: flex; align-items: center; gap: 14px; height: 76px; padding: 0 28px 0 14px; border-radius: 38px; background: rgba(28, 28, 34, 0.92); font: 500 22px/1.25 var(--font-body); animation: helloIn 0.5s ease; max-width: calc(100% - 40px); }
.load-hello img { width: 52px; height: 52px; border-radius: 50%; background: #3a2a6a; }
.load-hello b { display: block; font-weight: 700; }
.rot-hint { position: absolute; right: calc(var(--sr) + 18px); top: calc(var(--st) + 18px); display: none; font: 700 16px/1.2 var(--font-body); background: rgba(18, 9, 40, 0.8); padding: 8px 12px; border-radius: 10px; }
@keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.06); opacity: 0.82; } }
@keyframes helloIn { from { transform: translate(-50%, -120%); } to { transform: translate(-50%, 0); } }

/* ---- лобі ---- */
#s-lobby { background: transparent; }
.l-top { position: absolute; left: calc(var(--sl) + 14px); right: calc(var(--sr) + 14px); top: calc(var(--st) + 12px); display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; z-index: 5; pointer-events: none; }
.l-top > .grp { display: flex; gap: 10px; align-items: flex-start; pointer-events: auto; min-width: 0; }
.prof { width: 186px; height: 76px; padding: 0 12px 4px 8px; justify-content: flex-start; gap: 10px; }
.prof .av { position: relative; width: 56px; height: 56px; flex: 0 0 auto; border-radius: 12px; border: 3px solid var(--ink); background: linear-gradient(#ff8a9e, #c8234a); overflow: visible; }
.prof .av img { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 9px; object-fit: cover; }
.prof .lv { position: absolute; left: -12px; top: -12px; width: 32px; height: 32px; border-radius: 9px; background: linear-gradient(#7fd3ff, #2a72d8); border: 3px solid var(--ink); font: 900 16px/26px var(--font-body); text-align: center; transform: rotate(45deg); }
.prof .lv > span { display: block; transform: rotate(-45deg); }
.prof .pn { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 0; flex: 1 1 auto; text-transform: none; }
.prof .pn .lbl { font-size: 22px; max-width: 100%; }
.prof .pn .sub { font: 700 14px/1 var(--font-body); color: #cbbdf5; text-shadow: none; max-width: 100%; }
.trb { width: 214px; height: 76px; padding: 0 14px 4px 10px; gap: 10px; justify-content: flex-start; }
.trb .ti { width: 48px; height: 48px; flex: 0 0 auto; }
.trb .tv { display: flex; flex-direction: column; gap: 6px; flex: 1 1 auto; min-width: 0; }
.trb .tv .lbl { font-size: 30px; color: #ffe36b; }
.trb .bar { height: 12px; }
.rankb { width: 76px; height: 76px; }
.menub { width: 70px; height: 64px; }
.l-cur { display: flex; gap: 12px; padding-left: 8px; }
.lcol { position: absolute; top: calc(var(--st) + 108px); display: flex; flex-direction: column; gap: 12px; z-index: 4; }
.lcol.left { left: calc(var(--sl) + 14px); gap: 8px; }
.lcol.left .side { height: 80px; }
.lcol.left .side > .ico.bi { width: 42px; height: 42px; }
.lcol.right { right: calc(var(--sr) + 14px); gap: 8px; }
.side { width: 128px; height: 92px; flex-direction: column; gap: 2px; padding: 6px 6px 12px; border-radius: 18px; }
.side > .ico.bi { width: 50px; height: 50px; flex: 0 0 auto; filter: drop-shadow(0 3px 0 rgba(0, 0, 0, 0.35)); }
.side .lbl { font-size: 18px; width: 100%; text-align: center; }
.lcol.right .side { height: 80px; }
.lcol.right .side > .ico.bi { width: 42px; height: 42px; }
.side .sub { position: absolute; bottom: -12px; left: 50%; transform: translateX(-50%); padding: 3px 8px; border-radius: 8px; background: var(--ink); font: 800 13px/1 var(--font-body); white-space: nowrap; text-transform: none; color: #ffe36b; }
.binfo { position: absolute; left: 50%; top: calc(var(--st) + 100px); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; z-index: 3; cursor: pointer; }
.binfo .row { display: flex; align-items: center; gap: 8px; height: 50px; padding: 0 12px 0 6px; border-radius: 16px; background: rgba(18, 9, 40, 0.75); border: 3px solid var(--ink); }
.rbadge { position: relative; width: 44px; height: 44px; flex: 0 0 auto; }
.rbadge svg { width: 100%; height: 100%; }
.rbadge b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 900 17px/1 var(--font-body); }
.binfo .trp { display: flex; align-items: center; gap: 4px; font: 900 24px/1 var(--font-body); color: #ffe36b; }
.binfo .trp .ico { width: 32px; height: 32px; }
.plv { width: 38px; height: 38px; flex: 0 0 auto; border-radius: 50%; border: 3px solid var(--ink); background: radial-gradient(circle at 35% 30%, #ffb3f0, #b03dd6 70%); display: flex; align-items: center; justify-content: center; font: 900 18px/1 var(--font-body); }
.gears { display: flex; gap: 3px; }
.gears .ico { width: 26px; height: 26px; }
.gears .ico.off { opacity: 0.25; filter: grayscale(1); }
.binfo .bn { font: 900 30px/1 var(--font-display); letter-spacing: 0.02em; text-transform: uppercase; }
.slot { position: absolute; top: calc(50% - 10px); width: 92px; height: 92px; border-radius: 20px; border: 4px dashed rgba(255, 255, 255, 0.55); background: rgba(255, 255, 255, 0.1); display: flex; align-items: center; justify-content: center; z-index: 3; transition: transform 0.08s; }
.slot .ico { width: 46px; height: 46px; }
.slot.is-down { transform: scale(0.95); }
.slot.s0 { left: calc(50% - 321px); } .slot.s1 { left: calc(50% + 229px); }
.slot.full { top: auto; bottom: 170px; width: 150px; height: 220px; border: 0; background: none; align-items: flex-start; }
.slot.full.s0 { left: calc(50% - 350px); } .slot.full.s1 { left: calc(50% + 200px); }
.slot .tag { margin-top: -8px; max-width: 150px; padding: 4px 10px 5px; border-radius: 10px; background: rgba(18, 9, 40, 0.8); border: 3px solid var(--ink); font: 800 16px/1 var(--font-body); }
.hanger { position: absolute; bottom: calc(var(--sb) + 172px); width: 64px; height: 60px; z-index: 4; }
.clubmsg { position: absolute; z-index: 4; width: 240px; padding: 8px 12px 10px; border-radius: 16px; background: #fff; color: var(--ink); border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); text-align: left; animation: bob 3s ease-in-out infinite; }
.clubmsg::after { content: ""; position: absolute; left: 50%; bottom: -16px; margin-left: -10px; border: 10px solid transparent; border-top: 12px solid var(--ink); }
.clubmsg .cw { display: flex; align-items: center; gap: 6px; font: 800 14px/1 var(--font-body); color: #d1294b; }
.clubmsg .cw .ico { width: 22px; height: 22px; flex: 0 0 auto; }
.clubmsg .ct { margin-top: 4px; font: 700 16px/1.2 var(--font-body); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.hero-hit { position: absolute; left: 50%; bottom: calc(var(--sb) + 150px); width: 220px; height: 300px; transform: translateX(-50%); z-index: 2; border-radius: 40px; }
.l-bot { position: absolute; left: calc(var(--sl) + 14px); right: calc(var(--sr) + 14px); bottom: calc(var(--sb) + 16px); height: 128px; display: flex; align-items: flex-end; gap: 12px; z-index: 5; pointer-events: none; }
.l-bot > * { pointer-events: auto; }
.l-bot .spacer { flex: 1 1 0; pointer-events: none; }
.passbtn { width: 220px; height: 122px; flex: 0 0 auto; flex-direction: column; align-items: stretch; justify-content: space-between; padding: 8px 12px 14px; --c1: #ff9a5a; --c2: #ff5f6d; --edge: #b52a4a; }
.passbtn .pt { display: flex; align-items: center; gap: 10px; min-width: 0; }
.passbtn .pt .ico { width: 62px; height: 62px; flex: 0 0 auto; margin: -16px 0 -6px -6px; filter: drop-shadow(0 4px 0 rgba(0, 0, 0, 0.35)); }
.passbtn .pt .tt { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; align-items: flex-start; }
.passbtn .pt .tt .lbl { font-size: 19px; }
.passbtn .pt .tier { font: 900 30px/1 var(--font-body); }
.passbtn .bar { height: 20px; border-radius: 10px; }
.passbtn .bar > i { background: linear-gradient(#7fd3ff, #2a8cf0); }
.questbtn { width: 140px; height: 112px; flex: 0 0 auto; flex-direction: column; gap: 4px; padding: 8px 8px 14px; --c1: #7fd3ff; --c2: #2b8cf0; --edge: #1655b0; }
.questbtn .ico { width: 54px; height: 54px; filter: drop-shadow(0 3px 0 rgba(0, 0, 0, 0.35)); }
.questbtn .lbl { font-size: 18px; width: 100%; text-align: center; }
.questbtn .ribbon { top: -14px; right: -12px; }
.timebub { position: absolute; left: 50%; bottom: calc(100% + 14px); transform: translateX(-50%); padding: 6px 10px 7px; border-radius: 12px; background: linear-gradient(#ff7d92, #e5264a); border: 3px solid var(--ink); font: 800 15px/1 var(--font-body); white-space: nowrap; box-shadow: 0 3px 0 var(--ink); }
.timebub::after { content: ""; position: absolute; left: 50%; top: 100%; margin-left: -8px; border: 8px solid transparent; border-top-color: var(--ink); }
.modewrap { position: relative; flex: 0 1 470px; min-width: 290px; height: 106px; }
.modebtn { position: relative; width: 100%; height: 106px; justify-content: flex-start; gap: 12px; padding: 8px 54px 12px 10px; --c1: #50408f; --c2: #2c1f66; --edge: #1d1348; text-transform: none; }
.modebtn .mi { width: 82px; height: 82px; flex: 0 0 auto; border-radius: 16px; border: 3px solid var(--ink); padding: 8px; background: linear-gradient(var(--m1), var(--m2)); box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.3); }
.modebtn .mt { display: flex; flex-direction: column; align-items: flex-start; gap: 5px; min-width: 0; flex: 1 1 auto; }
.modebtn .mtime { font: 700 14px/1 var(--font-body); color: #c8bdf0; max-width: 100%; }
.modebtn .mname { font: 900 27px/1 var(--font-body); text-transform: uppercase; max-width: 100%; }
.modebtn .mmap { font: 800 18px/1 var(--font-body); color: #8affb4; max-width: 100%; }
.modeinfo { position: absolute; right: 8px; top: 8px; width: 40px; height: 40px; z-index: 2; border-radius: 50%; }
.modeinfo .ico { width: 100%; height: 100%; }
.playbtn { width: 262px; height: 116px; flex: 0 0 auto; border-radius: 22px; font-size: 46px; padding-bottom: 8px; box-shadow: inset 0 -9px 0 var(--edge), inset 0 4px 0 rgba(255, 255, 255, 0.6), 0 7px 0 var(--ink); }
.playbtn .lbl { font-family: var(--font-display); letter-spacing: 0.04em; }
.playbtn.is-down { transform: translateY(5px); box-shadow: inset 0 -4px 0 var(--edge), 0 2px 0 var(--ink); }
.playbtn::after { content: ""; position: absolute; inset: 0; border-radius: 19px; background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, 0.55) 50%, transparent 65%); background-size: 250% 100%; animation: shine 3.2s ease-in-out infinite; pointer-events: none; z-index: -1; }
@keyframes shine { 0%, 60% { background-position: 150% 0; } 100% { background-position: -100% 0; } }
.wins { position: absolute; right: calc(var(--sr) + 14px); bottom: calc(var(--sb) + 152px); width: 262px; height: 58px; display: flex; gap: 4px; padding: 5px; border-radius: 14px; background: linear-gradient(#3d7bff, #2a4fd0); border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); z-index: 4; }

/* ---- підекрани ---- */
.sub { background: radial-gradient(130% 100% at 50% 0%, #4d2c9e 0%, #2a1662 55%, #180c3a 100%); }

.sub.rk-bg { background: radial-gradient(130% 100% at 50% 0%, #2a6ad8 0%, #1d2f80 55%, #0e1040 100%); }
.hdr { position: absolute; left: calc(var(--sl) + 14px); right: calc(var(--sr) + 14px); top: calc(var(--st) + 12px); height: 66px; display: flex; align-items: center; gap: 14px; z-index: 3; }

.body { position: absolute; left: calc(var(--sl) + 14px); right: calc(var(--sr) + 14px); top: calc(var(--st) + 94px); bottom: calc(var(--sb) + 14px); }

/* ---- бійці ---- */

.bcard { position: relative; height: 200px; border-radius: 18px; border: 3px solid var(--ink); background: linear-gradient(var(--r1), var(--r2)); box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.35), 0 5px 0 var(--ink); overflow: hidden; transition: transform 0.08s; }

.bcard .lockinfo { position: absolute; left: 0; right: 0; top: 44%; display: flex; flex-direction: column; align-items: center; gap: 4px; font: 800 15px/1.1 var(--font-body); text-align: center; padding: 0 8px; }
.bcard .lockinfo .ico { width: 40px; height: 40px; }
.bcard.sel { box-shadow: 0 0 0 4px #ffe36b, 0 5px 0 var(--ink); }

.bcard .upg { position: absolute; left: 8px; bottom: 46px; width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(#86ffbf, #17c46f); border: 3px solid var(--ink); font: 900 20px/22px var(--font-body); text-align: center; animation: bob 1.4s ease-in-out infinite; }

/* ---- деталі бійця ---- */
.bd { display: flex; gap: 18px; height: 100%; }
.bd-left { width: 380px; flex: 0 0 auto; display: flex; flex-direction: column; gap: 12px; }
.bd-stage { position: relative; flex: 1 1 auto; min-height: 220px; border-radius: 22px; border: 3px solid var(--ink); background: radial-gradient(circle at 50% 55%, var(--r1), var(--r2) 75%); box-shadow: inset 0 4px 0 rgba(255, 255, 255, 0.3), 0 5px 0 var(--ink); overflow: hidden; }

.bd-skins { display: flex; gap: 10px; height: 128px; flex: 0 0 auto; }
.skin { position: relative; flex: 1 1 0; min-width: 0; border-radius: 16px; border: 3px solid var(--ink); background: linear-gradient(#5a46b0, #33237a); display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 0 6px 8px; overflow: hidden; box-shadow: 0 4px 0 var(--ink); }

.skin.on { box-shadow: 0 0 0 4px #ffe36b, 0 4px 0 var(--ink); }

.bd-right { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.bd-head { display: flex; align-items: center; gap: 14px; min-height: 64px; }

.bd-scroll { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 12px; padding: 2px 4px 8px; }

.bd-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { display: flex; align-items: center; gap: 10px; height: 62px; padding: 0 10px; border-radius: 14px; background: rgba(18, 9, 40, 0.55); border: 3px solid var(--ink); }

.abil { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 16px; background: rgba(18, 9, 40, 0.5); border: 3px solid var(--ink); min-height: 82px; }

.abil .at { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 4px; }

.bd-act { display: flex; gap: 12px; flex: 0 0 auto; }

/* ---- режими ---- */
.mgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; padding: 10px 6px 24px; }
.mcard { position: relative; height: 156px; display: flex; align-items: center; gap: 14px; padding: 12px 56px 14px 14px; border-radius: 20px; border: 3px solid var(--ink); background: linear-gradient(135deg, var(--m1), var(--m2)); box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.3), 0 5px 0 var(--ink); text-align: left; transition: transform 0.08s; }

/* ---- пропуск ---- */
.pass { display: flex; gap: 18px; height: 100%; }

.qwrap { display: flex; flex-direction: column; gap: 14px; height: 100%; }

/* ---- рейтинг ---- */

.lemb b { position: absolute; left: 50%; bottom: -8px; transform: translateX(-50%); min-width: 54px; padding: 4px 10px 6px; border-radius: 12px; background: var(--ink); text-align: center; font: 900 22px/1 var(--font-display); }

.rk-row .lemb b { font-size: 0; }

/* ---- профіль ---- */

.pf-av { position: relative; width: 150px; height: 150px; border-radius: 26px; border: 4px solid var(--ink); background: linear-gradient(#ff8a9e, #c8234a); box-shadow: 0 6px 0 var(--ink); }
.pf-av img { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 22px; }
.pf-name { display: flex; align-items: center; gap: 10px; width: 100%; justify-content: center; }
.pf-name .lbl { font: 900 30px/1.1 var(--font-body); min-width: 0; }
.pf-name .btn { flex: 0 0 auto; width: 52px; height: 48px; }
.pf-lvl { width: 100%; display: flex; align-items: center; gap: 10px; }
.pf-lvl .lv { width: 46px; height: 46px; flex: 0 0 auto; border-radius: 12px; transform: rotate(45deg); background: linear-gradient(#7fd3ff, #2a72d8); border: 3px solid var(--ink); display: flex; align-items: center; justify-content: center; }
.pf-lvl .lv b { transform: rotate(-45deg); font: 900 19px/1 var(--font-body); }
.pf-lvl .bar { flex: 1; height: 22px; border-radius: 11px; }

.pf-icons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; }
.pf-icons button { position: relative; aspect-ratio: 1; border-radius: 14px; border: 3px solid var(--ink); background: linear-gradient(#5a46b0, #33237a); overflow: hidden; }
.pf-icons button img { width: 100%; height: 100%; }
.pf-icons button.on { box-shadow: 0 0 0 3px #ffe36b; }
.pf-icons button.lock img { filter: brightness(0) opacity(0.4); }
.pf-stats { flex: 1 1 auto; min-width: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); grid-auto-rows: 104px; gap: 14px; align-content: start; }
.pstat { display: flex; align-items: center; gap: 14px; padding: 0 16px; }
.pstat .ico { width: 54px; height: 54px; flex: 0 0 auto; }
.pstat .pv { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.pstat .pv small { font: 700 15px/1.1 var(--font-body); color: #cbbdf5; }
.pstat .pv b { font: 900 30px/1 var(--font-body); }
.pstat img { width: 54px; height: 54px; border-radius: 12px; border: 3px solid var(--ink); flex: 0 0 auto; background: #3b2a86; }

/* ---- друзі ---- */
.fr { display: flex; flex-direction: column; gap: 12px; height: 100%; }
.fr-top { display: flex; align-items: center; gap: 14px; padding: 12px 16px; }
.fr-top > .ico { width: 54px; height: 54px; flex: 0 0 auto; }
.fr-top .code { flex: 1 1 auto; min-width: 0; font: 800 19px/1.2 var(--font-body); }
.fr-top .code b { color: #ffe36b; }
.flist { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 12px; align-content: start; padding: 2px 4px 10px; }
.frow { display: flex; align-items: center; gap: 14px; padding: 10px 14px; height: 92px; }
.frow img { width: 64px; height: 64px; border-radius: 14px; border: 3px solid var(--ink); background: linear-gradient(#5a46b0, #33237a); flex: 0 0 auto; }
.frow .fi { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.frow .fi b { font: 900 21px/1.1 var(--font-body); }
.frow .fi small { display: flex; align-items: center; gap: 6px; font: 700 15px/1 var(--font-body); color: #cbbdf5; }
.frow .fi small .ico { width: 20px; height: 20px; }
.st { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--ink); }
.st.on { background: #2fe08f; } .st.game { background: #ffc531; } .st.off { background: #8b80aa; }
.frow .btn { flex: 0 0 auto; min-width: 150px; height: 52px; font-size: 19px; }

/* ---- клуб ---- */
.cl { display: flex; gap: 18px; height: 100%; }
.cl-info { width: 360px; flex: 0 0 auto; display: flex; flex-direction: column; gap: 10px; padding: 14px; min-height: 0; }
.cl-head { display: flex; align-items: center; gap: 12px; }
.cl-head .ico { width: 72px; height: 72px; flex: 0 0 auto; }
.cl-head .cn { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.cl-head .cn b { font: 900 24px/1.1 var(--font-body); }
.cl-head .cn small { font: 700 15px/1 var(--font-body); color: #cbbdf5; }
.cl-sum { display: flex; gap: 10px; }
.cl-sum > div { flex: 1; display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 12px; background: rgba(18, 9, 40, 0.5); font: 900 18px/1 var(--font-body); }
.cl-sum .ico { width: 28px; height: 28px; }
.members { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
.mrow { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 12px; background: rgba(18, 9, 40, 0.42); }
.mrow img { width: 40px; height: 40px; border-radius: 10px; flex: 0 0 auto; background: #3b2a86; }
.mrow .mi2 { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.mrow .mi2 b { font: 800 16px/1.1 var(--font-body); }
.mrow .mi2 small { font: 700 13px/1 var(--font-body); color: #cbbdf5; }
.mrow .mt2 { display: flex; align-items: center; gap: 3px; font: 900 15px/1 var(--font-body); color: #ffe36b; }
.mrow .mt2 .ico { width: 20px; height: 20px; }
.mrow.me { background: rgba(56, 182, 255, 0.28); }
.chat { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 10px; padding: 14px; }
.msgs { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 10px; padding: 4px; }
.msg { max-width: 78%; align-self: flex-start; padding: 8px 12px 10px; border-radius: 4px 16px 16px 16px; background: #fff; color: var(--ink); border: 3px solid var(--ink); }
.msg b { display: block; font: 800 14px/1.1 var(--font-body); color: #d1294b; margin-bottom: 2px; }
.msg span { font: 600 17px/1.3 var(--font-body); word-break: break-word; }
.msg.me { align-self: flex-end; border-radius: 16px 4px 16px 16px; background: #c9f0ff; }
.msg.me b { color: #1655b0; }
.chat-in { display: flex; gap: 10px; }
.chat-in input { flex: 1 1 auto; min-width: 0; height: 56px; padding: 0 16px; border-radius: 14px; border: 3px solid var(--ink); background: #fff; color: var(--ink); font: 700 19px/1 var(--font-body); outline: none; -webkit-user-select: text; user-select: text; touch-action: manipulation; }
.chat-in input:focus { box-shadow: 0 0 0 3px #ffe36b; }
.chat-in .btn { width: 76px; height: 56px; }

/* ---- новини ---- */
.news { display: flex; gap: 16px; height: 100%; padding: 4px 6px 10px; }
.ncard { width: 340px; flex: 0 0 auto; display: flex; flex-direction: column; overflow: hidden; }
.ncard .nb { height: 120px; flex: 0 0 auto; position: relative; background: linear-gradient(135deg, var(--n1), var(--n2)); border-bottom: 3px solid var(--ink); overflow: hidden; }
.ncard .nb img { position: absolute; right: 8px; bottom: -18px; width: 140px; height: 140px; }
.ncard .nb .chip { position: absolute; left: 12px; top: 12px; background: rgba(18, 9, 40, 0.7); border-width: 2px; }
.ncard .nt { padding: 14px 16px 6px; font: 900 22px/1.15 var(--font-body); }
.ncard .nd { padding: 0 16px; font: 700 14px/1 var(--font-body); color: #cbbdf5; }
.ncard .nx { padding: 10px 16px 16px; font: 500 16px/1.4 var(--font-body); color: #ece6ff; overflow: hidden; }

/* ---- пошук матчу і VS ---- */
#s-mm, #s-vs, #s-result, #s-drop { z-index: 20; }
#s-mm { background: radial-gradient(120% 100% at 50% 40%, rgba(70, 40, 150, 0.92), rgba(18, 9, 40, 0.97)); }
.mm { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 18px; width: 640px; }
.mm .mi { width: 130px; height: 130px; animation: bob 1.2s ease-in-out infinite; }
.mm .mt { font: 900 40px/1.1 var(--font-display); text-align: center; text-transform: uppercase; max-width: 100%; }
.mm .ms { font: 800 22px/1 var(--font-body); color: #d9ccff; }
.mm .dots { display: flex; gap: 10px; }
.mm .dots i { width: 38px; height: 38px; border-radius: 10px; border: 3px solid var(--ink); background: rgba(255, 255, 255, 0.15); transition: background 0.2s, transform 0.2s; }
.mm .dots i.on { background: linear-gradient(#86ffbf, #17c46f); transform: scale(1.08); }
.mm .btn { margin-top: 10px; min-width: 240px; }
#s-vs { background: linear-gradient(105deg, #1f4fd0 0 49.6%, var(--ink) 49.6% 50.4%, #c8234a 50.4%); overflow: hidden; }
.vs-side { position: absolute; top: 0; bottom: 0; width: 50%; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 0 40px; }
.vs-side.l { left: 0; align-items: flex-start; padding-left: calc(var(--sl) + 40px); animation: vsL 0.5s cubic-bezier(0.2, 1.3, 0.4, 1); }
.vs-side.r { right: 0; align-items: flex-end; padding-right: calc(var(--sr) + 40px); animation: vsR 0.5s cubic-bezier(0.2, 1.3, 0.4, 1); }
.vs-card { display: flex; align-items: center; gap: 12px; width: 380px; max-width: 100%; height: 108px; padding: 8px 14px 8px 8px; border-radius: 20px; border: 3px solid var(--ink); background: rgba(18, 9, 40, 0.55); box-shadow: 0 5px 0 var(--ink); }
.vs-side.r .vs-card { flex-direction: row-reverse; padding: 8px 8px 8px 14px; text-align: right; }
.vs-card img { width: 90px; height: 90px; border-radius: 14px; background: rgba(255, 255, 255, 0.15); flex: 0 0 auto; }
.vs-card .vn { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 5px; }
.vs-side.r .vs-card .vn { align-items: flex-end; }
.vs-card .vn b { font: 900 22px/1.1 var(--font-body); max-width: 100%; }
.vs-card .vn small { font: 700 15px/1 var(--font-body); color: #e4dbff; text-transform: uppercase; max-width: 100%; }
.vs-card.me { box-shadow: 0 0 0 4px #ffe36b, 0 5px 0 var(--ink); }
.vs-mid { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-6deg); font: 900 120px/1 var(--font-display); color: #ffe36b; z-index: 2; animation: vsPop 0.6s cubic-bezier(0.2, 1.6, 0.4, 1); }
.vs-map { position: absolute; left: 50%; bottom: calc(var(--sb) + 26px); transform: translateX(-50%); padding: 8px 20px 10px; border-radius: 14px; background: rgba(18, 9, 40, 0.8); border: 3px solid var(--ink); font: 800 20px/1 var(--font-body); white-space: nowrap; z-index: 2; }
.vs-surv { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 24px; width: 92%; }
.vs-surv .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.vs-surv .row img { width: 92px; height: 92px; border-radius: 16px; border: 3px solid var(--ink); background: rgba(18, 9, 40, 0.5); }
.vs-surv .row img.me { box-shadow: 0 0 0 4px #ffe36b; }
.vs-surv .t { font: 900 48px/1 var(--font-display); text-transform: uppercase; }
@keyframes vsL { from { transform: translateX(-60%); } to { transform: none; } }
@keyframes vsR { from { transform: translateX(60%); } to { transform: none; } }
@keyframes vsPop { from { transform: translate(-50%, -50%) scale(3) rotate(-6deg); opacity: 0; } to { transform: translate(-50%, -50%) scale(1) rotate(-6deg); opacity: 1; } }

/* ---- бій ---- */
#s-battle { background: transparent; }
#inputLayer { position: absolute; inset: 0; touch-action: none; }
#hud { position: absolute; inset: 0; pointer-events: none; }
#hud .btn, #hud .pin { pointer-events: auto; }
.hud-top { position: absolute; left: calc(var(--sl) + 12px); right: calc(var(--sr) + 12px); top: calc(var(--st) + 10px); display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.hud-pause, .hud-emote { width: 62px; height: 58px; }
.hud-score { display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 6px 14px; border-radius: 18px; background: rgba(18, 9, 40, 0.72); border: 3px solid var(--ink); box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3); }
.sc-side { display: flex; align-items: center; gap: 8px; }
.sc-side b { font: 900 34px/1 var(--font-body); min-width: 42px; text-align: center; }
.sc-side b.sm { font-size: 22px; min-width: 52px; }
.sc-side.t0 b { color: #8fd8ff; } .sc-side.t1 b { color: #ff9aa8; }
.sc-ico { width: 40px; height: 40px; flex: 0 0 auto; }
.sc-mid { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-width: 100px; }
.sc-clock { font: 900 28px/1 var(--font-body); }
.sc-clock.sm { font-size: 22px; white-space: nowrap; }
.sc-cd { font: 900 20px/1 var(--font-body); min-height: 0; white-space: nowrap; }
.sc-cd.on { min-height: 22px; animation: pulse 0.6s ease-in-out infinite; }
.sc-cd.good { color: #8affb4; } .sc-cd.bad { color: #ff7a8a; }
.sc-bar { position: relative; width: 104px; height: 18px; border-radius: 9px; background: rgba(10, 4, 24, 0.75); border: 2px solid var(--ink); overflow: hidden; }
.sc-bar i { position: absolute; top: 0; bottom: 0; width: 0; border-radius: 8px; }
.t0 .sc-bar i { left: 0; background: linear-gradient(#8fd8ff, #2a8cf0); }
.t1 .sc-bar i { right: 0; background: linear-gradient(#ff9aa8, #e52b4b); }
.pips { display: flex; gap: 5px; }
.pips i { width: 20px; height: 20px; border-radius: 50%; border: 3px solid var(--ink); background: rgba(255, 255, 255, 0.2); }
.pips i.on { background: #38b6ff; } .pips.red i.on { background: #ff4867; }
.heads { display: flex; gap: 3px; }
.heads i { width: 24px; height: 24px; border-radius: 8px; border: 3px solid var(--ink); background: #8fd8ff; }
.t1 .heads i { background: #ff9aa8; }
.heads i.dead { background: #4a4060; }
.sc-surv { display: flex; align-items: center; gap: 8px; max-width: 260px; }
.sc-surv b { font: 900 34px/1 var(--font-body); }
.sc-surv .sc-lbl { font: 800 18px/1 var(--font-body); text-transform: uppercase; }
.sc-surv.wide { max-width: 320px; }
.sc-gas { font: 700 15px/1 var(--font-body); color: #b8ffb0; white-space: nowrap; }
.hud-right { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
.feed { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
.kf { display: flex; align-items: center; gap: 4px; padding: 3px 5px; border-radius: 12px; background: rgba(18, 9, 40, 0.72); border: 2px solid var(--ink); animation: kfIn 0.25s ease; }
.kf-p img, .kf-gas { display: block; width: 38px; height: 38px; border-radius: 10px; border: 3px solid #ccc; background: rgba(255, 255, 255, 0.15); }
.kf-gas { background: #3fd06b; }
.kf-p.me img { border-color: #38b6ff; } .kf-p.en img { border-color: #ff4867; }
.kf-x { width: 22px; height: 22px; }
@keyframes kfIn { from { transform: translateX(30px); opacity: 0; } to { transform: none; opacity: 1; } }
.hud-banner { position: absolute; left: 0; right: 0; top: 30%; text-align: center; font: 900 76px/1 var(--font-display); letter-spacing: 0.03em; opacity: 0; pointer-events: none; }
.hud-banner.on { animation: bannerIn 0.9s cubic-bezier(0.2, 1.4, 0.4, 1) forwards; }
.hud-banner.good span { color: #ffe36b; } .hud-banner.bad span { color: #ff8293; } .hud-banner.warn span { color: #ffd18a; font-size: 48px; }
.hud-banner.count span { font-size: 130px; color: #fff; } .hud-banner.go span { font-size: 110px; color: #8affb4; } .hud-banner.info span { color: #fff; font-size: 58px; }
@keyframes bannerIn { 0% { opacity: 0; transform: scale(2.2); } 30% { opacity: 1; transform: scale(1); } 85% { opacity: 1; } 100% { opacity: 0.9; transform: scale(1); } }
.hud-msg { position: absolute; left: 0; right: 0; top: 58%; text-align: center; font: 900 32px/1 var(--font-body); }
.emote-panel { position: absolute; right: calc(var(--sr) + 84px); top: calc(var(--st) + 10px); display: none; grid-template-columns: repeat(4, 58px); gap: 8px; padding: 10px; border-radius: 18px; background: rgba(18, 9, 40, 0.85); border: 3px solid var(--ink); pointer-events: auto; }
.emote-panel.on { display: grid; animation: popIn 0.18s ease; }
.pin { width: 58px; height: 58px; font-size: 32px; line-height: 1; border-radius: 14px; background: #fff; border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); }
.pin.is-down { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.ctl { position: absolute; left: 0; top: 0; pointer-events: none; }
.ctl.move .ctl-base { width: 100%; height: 100%; border-radius: 50%; background: rgba(255, 255, 255, 0.08); border: 4px solid rgba(255, 255, 255, 0.28); }
.ctl.move .ctl-knob { position: absolute; left: 50%; top: 50%; width: 66px; height: 66px; margin: -33px 0 0 -33px; border-radius: 50%; background: rgba(255, 255, 255, 0.6); border: 4px solid rgba(22, 12, 44, 0.55); }
.ctl.move:not(.on) { opacity: 0.5; }
.ctl-ring { position: absolute; inset: 0; border-radius: 50%; }
.ctl-knob { position: absolute; left: 50%; top: 50%; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 4px solid var(--ink); }
.ctl.atk .ctl-ring { background: rgba(255, 72, 103, 0.16); border: 4px solid rgba(255, 72, 103, 0.55); }
.ctl.atk .ctl-knob { width: 100px; height: 100px; margin: -50px 0 0 -50px; background: radial-gradient(circle at 35% 30%, #ffb0bc, #e52b4b 58%, #9a1230); box-shadow: 0 6px 0 var(--ink); }
.ctl.atk .ctl-knob .ico { width: 56px; height: 56px; }
.ctl.atk.drag .ctl-ring { background: rgba(255, 72, 103, 0.32); }
.ctl.atk.empty .ctl-knob { filter: grayscale(0.7) brightness(0.75); }
.ctl.atk .ctl-ball { display: none; }
.ctl.atk.ball .ctl-ball { display: block; position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; }
.ctl.atk.ball .ctl-knob .ico { opacity: 0; }
.ctl.sup .ctl-ring { inset: -8px; background: conic-gradient(#ffc531 calc(var(--p, 0) * 360deg), rgba(22, 12, 44, 0.55) 0); -webkit-mask: radial-gradient(circle, transparent 60%, #000 61.5%); mask: radial-gradient(circle, transparent 60%, #000 61.5%); }
.ctl.sup .ctl-knob { width: 90px; height: 90px; margin: -45px 0 0 -45px; background: radial-gradient(circle at 35% 30%, #fff1a8, #ffb11f 60%, #c26a00); box-shadow: 0 5px 0 var(--ink); filter: grayscale(0.9) brightness(0.6); }
.ctl.sup .ctl-knob .ico { width: 56px; height: 56px; }
.ctl.sup.ready .ctl-knob { filter: none; animation: supPulse 1s ease-in-out infinite; }
.ctl.gad .ctl-knob { width: 76px; height: 76px; margin: -38px 0 0 -38px; background: radial-gradient(circle at 35% 30%, #b8ffd6, #18c46f 60%, #0b7a44); box-shadow: 0 5px 0 var(--ink); }
.ctl.gad .ctl-knob .ico { width: 48px; height: 48px; }
.ctl.gad.off .ctl-knob { filter: grayscale(0.85) brightness(0.65); }
.gpips { position: absolute; left: 50%; bottom: -16px; transform: translateX(-50%); display: flex; gap: 4px; }
.gpips i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--ink); background: rgba(255, 255, 255, 0.25); }
.gpips i.on { background: #2fe08f; }
.gcd { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; font: 900 28px/1 var(--font-body); text-shadow: 0 0 4px var(--ink), 0 2px 0 var(--ink); }
.ctl.hyp .ctl-ring { inset: -7px; background: conic-gradient(#c070ff calc(var(--p, 0) * 360deg), rgba(22, 12, 44, 0.55) 0); -webkit-mask: radial-gradient(circle, transparent 60%, #000 61.5%); mask: radial-gradient(circle, transparent 60%, #000 61.5%); }
.ctl.hyp .ctl-knob { width: 72px; height: 72px; margin: -36px 0 0 -36px; background: radial-gradient(circle at 35% 30%, #e6c2ff, #9b3df0 60%, #5a1fae); box-shadow: 0 5px 0 var(--ink); filter: grayscale(0.85) brightness(0.6); }
.ctl.hyp .ctl-knob .ico { width: 46px; height: 46px; }
.ctl.hyp.ready .ctl-knob, .ctl.hyp.active .ctl-knob { filter: none; animation: supPulse 0.8s ease-in-out infinite; }
.ctl.hit .ctl-knob { animation: hitPop 0.2s ease; }
@keyframes supPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
@keyframes hitPop { 50% { transform: scale(0.86); } }
.hud-keys { position: absolute; left: 50%; bottom: calc(var(--sb) + 8px); transform: translateX(-50%); padding: 6px 12px; border-radius: 10px; background: rgba(18, 9, 40, 0.6); font: 600 14px/1 var(--font-body); color: rgba(255, 255, 255, 0.8); white-space: nowrap; }
#hud.ended .ctl, #hud.ended .hud-keys, #hud.ended .hud-pause, #hud.ended .hud-emote { opacity: 0; pointer-events: none; }

/* ---- результат ---- */
#s-result { background: linear-gradient(rgba(18, 9, 40, 0.55), rgba(18, 9, 40, 0.92)); }

/* ---- скриня удачі ---- */

.drop { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 16px; width: 92%; }
.drop .dn { font: 900 40px/1.1 var(--font-display); text-transform: uppercase; text-align: center; max-width: 100%; }
.capsule { position: relative; width: 230px; height: 230px; border-radius: 70px; border: 6px solid var(--ink); background: linear-gradient(var(--d1, #7fd3ff), var(--d2, #2b8cf0)); box-shadow: inset 0 10px 0 rgba(255, 255, 255, 0.35), inset 0 -16px 0 rgba(0, 0, 0, 0.25), 0 10px 0 var(--ink), 0 0 80px var(--d1, #38b6ff); animation: capIdle 1.4s ease-in-out infinite; }
.capsule::before { content: ""; position: absolute; left: -6px; right: -6px; top: 50%; height: 16px; margin-top: -8px; background: var(--ink); }
.capsule::after { content: ""; position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 18px; border: 5px solid var(--ink); background: linear-gradient(#fff1a8, #ffb11f); }
.capsule.hit { animation: capHit 0.3s ease; }
.capsule.open { animation: capOpen 0.5s ease forwards; }
@keyframes capIdle { 0%, 100% { transform: rotate(-3deg) scale(1); } 50% { transform: rotate(3deg) scale(1.03); } }
@keyframes capHit { 0% { transform: scale(1); } 40% { transform: scale(0.85) rotate(-6deg); } 100% { transform: scale(1.06); } }
@keyframes capOpen { to { transform: scale(1.6); opacity: 0; } }

.drop .taps { display: flex; gap: 8px; }

.drop .taps i.used { background: rgba(255, 255, 255, 0.2); }
.reveal { display: flex; flex-direction: column; align-items: center; gap: 14px; animation: popIn 0.4s cubic-bezier(0.2, 1.5, 0.4, 1); }
.reveal .rv { width: 170px; height: 170px; filter: drop-shadow(0 8px 0 rgba(0, 0, 0, 0.35)); }
.reveal img.rv { border-radius: 26px; background: rgba(255, 255, 255, 0.15); border: 4px solid var(--ink); }

@keyframes popIn { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

@media (prefers-reduced-motion: reduce) {

}
